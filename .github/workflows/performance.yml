name: Performance benchmark

on:
  push:
    branches:
      - feature/real-world-map
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium benchmark runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/elcano-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/elcano-vite.log
          exit 1
      - name: Run mobile camera benchmark
        run: node scripts/perf-benchmark.mjs | tee perf-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: performance-result
          path: perf-result.txt
          retention-days: 14
